# Ralphy Configuration
# https://github.com/michaelshimeles/ralphy

# Project info
project:
  name: "RL-DCVS-Learning"
  language: "Markdown"
  framework: ""
  description: "RL learning curriculum for GPU DCVS tuning - generating structured educational documents"

# Commands
commands:
  test: ""
  lint: ""
  build: ""

# Rules - instructions the AI MUST follow
rules:
  - "All output files MUST be created inside the learn/ subfolder only"
  - "所有文档必须用中文书写，语言要通俗易懂、口语化，避免生硬的学术翻译腔"
  - "首次出现的专业术语必须同时给出英文原文，格式为：中文名（English Term），后续可只用中文"
  - "All mathematical formulas MUST use LaTeX format wrapped in $$ for block equations and $ for inline"
  - "对于复杂的计算流程、算法流程、公式推导过程和数值计算步骤，必须用 Mermaid 绘制流程图或示意图，以 ```mermaid 代码块嵌入 Markdown 文件中，可直接在 GitHub / VS Code / Typora 等 Markdown 预览器中渲染。禁止使用 TikZ"
  - "目标读者是线性代数只有入门水平的人，遇到矩阵运算、概率论、微积分等前置知识时，必须插入一个'补充知识'框（用 blockquote > 格式），用 1-2 段话解释清楚该前置知识，不要假设读者已经掌握"
  - "Every document MUST include at least one concrete numerical computation example using real DCVS data"
  - "数值计算示例要写出每一步的中间结果，不要跳步，让读者能用笔跟着算"
  - "Use real data ranges from the project: gpu_freq 282-710 MHz, gpu_usage 0-100%, power 0-8000 mW, FPS target 59-60, action space 192 discrete actions (6×4×4×2)"
  - "Do NOT modify any existing files outside learn/ folder"
  - "Do NOT modify the three source analysis documents (RL_Algorithm_Selection*.md, RL_DCVS_AI_Integrated*.md, RL_DCVS_Runtime_Adaptive*.md)"
  - "Each document should be self-contained and readable independently"
  - "Include a '前置阅读' section at the top of each document listing which previous documents should be read first"
  - "Include a '关键收获' summary section at the end of each document"
  - "对于每一个新概念，遵循四步法：① 直觉类比（用日常生活例子解释）→ ② 正式定义 → ③ 公式推导（配Mermaid图）→ ④ DCVS实际数值计算示例"
  - "文档中的图表说明文字也必须用中文"

# Boundaries - files/folders the AI should not modify
boundaries:
  never_touch:
    - "RL_Algorithm_Selection_for_GPU_DCVS_Tuning_20260401.md"
    - "RL_DCVS_AI_Integrated_Decision_2026-04-01.md"
    - "RL_DCVS_Runtime_Adaptive_Independent_Decision_GPT-5.4_2026-04-01_135421.md"
    - ".ralphy/**"
