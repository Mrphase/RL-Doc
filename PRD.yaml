    description: >
      Create learn/16_IQL.md.


      【全局要求】同01号任务的全局要求。


      Goal:

      严谨但易读地讲解Implicit Q-Learning（IQL）——源文档中强调的另一个核心离线RL算法。


      Required content:

      -
      类比引入：CQL是"主动压低不确定的评分"，IQL是"压根不去评价没见过的东西"——隐式地避开OOD动作，就像只看菜单上有的菜而从不尝试菜单外的。

      - 解释IQL的动机以及它和CQL显式保守惩罚的本质区别。

      - 解释三网络结构：Q网络、V网络、策略网络(π)，各自的作用。

      - Expectile回归：
        - 补充知识框：什么是"分位数"和"expectile"——"普通均值对所有误差一视同仁，expectile对'比均值大的误差'和'比均值小的误差'赋予不同权重"，用5个数的集合{2,3,5,8,12}手算τ=0.7的expectile。
        - 推导Expectile损失函数 $L_\tau^2(u) = |\tau - \mathbf{1}(u < 0)| \cdot u^2$。
        - 用Mermaid画expectile损失函数的形状图：横轴是u，纵轴是loss，左右两边斜率不同。
      - V网络的训练目标 $\mathcal{L}_V = \mathbb{E}_{(s,a) \sim D}[L_\tau^2(Q(s,a) -
      V(s))]$——解释τ如何控制V在"偏乐观"和"偏保守"之间选择。

      - 关键worked example：给定3个(s,a)对的Q值和当前V(s)估计，手算expectile loss的每一步和V(s)的梯度方向。

      - 解释为什么IQL在稀疏数据覆盖（30/192）下特别鲁棒：它永远不评估数据中不存在的动作。

      - 解释IQL的offline→online过渡为什么更平滑。

      - 公平对比IQL vs CQL在本项目中的适用场景：CQL更直接面向离散动作但可能过度保守；IQL更稳健但需要三个网络。
