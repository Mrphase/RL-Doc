  - title: Create 15_CQL.md
    completed: false
    parallel_group: 4
    description: |
      Create learn/15_CQL.md.

      【全局要求】同01号任务的全局要求。

      Goal:
      严谨但易读地讲解Conservative Q-Learning（CQL）——源文档中最重要的算法之一。

      Required content:
      - 类比引入：CQL就像一个"悲观的评估员"——对于没亲眼见过的东西，宁可低估也不要高估。在DCVS场景中，这意味着对没在日志数据中出现过的参数组合保持怀疑态度。
      - 解释保守离线RL的动机：直接用标准DQN在离线数据上训练 → 对OOD动作过度自信 → 部署后选择危险动作 → FPS崩溃。
      - 展示并逐项解释CQL损失函数：
        $$\mathcal{L}_{\text{CQL}} = \alpha \cdot \mathbb{E}_s\left[\log \sum_a \exp Q(s,a) - \mathbb{E}_{a \sim \hat{\pi}_\beta}[Q(s,a)]\right] + \frac{1}{2}\mathbb{E}_{(s,a,r,s')}[(Q - \mathcal{B}\hat{Q})^2]$$
      - 补充知识框：log-sum-exp是什么——"对所有动作的Q值的一种加权平均，偏向于大值"，用3个Q值的数值例子手算 log(exp(2)+exp(5)+exp(1))。
      - 补充知识框：行为策略 $\hat{\pi}_\beta$ 是什么——"数据中实际采用过的策略"。
      - 解释α的作用——太小则不够保守（回到标准DQN的问题），太大则过度保守（所有动作的Q值都被压低，策略退化）。
      - 用Mermaid画CQL的训练流程图：从replay buffer采样→计算Bellman目标→计算保守正则项（push down all, push up in-data）→总损失→更新Q网络。
      - 关键worked example：假设有3个动作（action A在数据中出现过、B在数据中出现过、C从未出现），给出初始Q值，手算一步CQL更新后各动作Q值的变化方向，展示C的Q值被压低。
      - 连接到192个DCVS离散动作：解释为什么CQL天然适合离散动作空间，argmax Q(s,a) 的推理延迟 < 1ms。
      - 讨论CQL在稀疏覆盖（30/192）下的优势和局限。
      - 解释为什么第一份源文档将离散CQL排为第一推荐。
  - title: Create 16_IQL.md
