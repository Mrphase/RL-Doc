      - 清晰写出每个公式并解释直觉：
        - FPS组件：分段函数，fps<57 → 重罚(-10×差值)，57≤fps<59 → 中罚，fps≥59 → 奖励+20
        - 频率组件：(900 - gpu_freq_mhz) / 80
        - 功耗组件：(6000 - power_ma) / 400
      - 用Mermaid画FPS组件的分段函数图：横轴是FPS，纵轴是奖励值，标注57和59两个拐点。

      - worked example 1：FPS=60, GPU频率=500MHz, 功耗=4000mA → 手算reward每个组件和总值。

      - worked example 2：FPS=55, GPU频率=282MHz, 功耗=2000mA →
      手算reward，展示FPS惩罚如何主导总奖励。

      - 讨论奖励缩放、冲突目标、以及为什么糟糕的奖励设计会扭曲学习。

      - 解释在线bandit和离线RL训练中奖励设计的差异。
